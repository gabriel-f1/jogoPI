<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>INÍCIO</title>
  <link rel="stylesheet" href="style.css">

  <link rel="icon" type="image/x-icon" href="imgs/intro/logo2.png">  
  <style>
    img {
     border-radius: 60px;
     margin: 40px 0;
     z-index: 1;
    }


    header {
        padding: 15px 20px;
        word-wrap: break-word;
        overflow-wrap: break-word;
        box-sizing: border-box;
        width: 100%;
    }

    header h1 {
        margin: 0;
        padding: 0;
        word-break: break-word;
        line-height: 1.2;
        font-size: clamp(1.5rem, 5vw, 2rem);
    }


    @media (max-width: 768px) {
        header {
            padding: 15px 10px;
        }
        
        header h1 {
            font-size: 1.3rem;
            line-height: 1.3;
        }
        
  
        body {
            overflow-x: hidden;
            width: 100%;
        }
        

        img {
            width: 80%;
            height: auto;
            max-width: 300px;
            margin: 20px 0;
        }
        

        .buttons-row .button-container3 button {
            width: 200px;
            height: 80px;
            font-size: 1.2rem;
        }
    }


    @media (max-width: 480px) {
        header h1 {
            font-size: 1.1rem;
        }
        
        img {
            width: 70%;
            max-width: 250px;
        }
    }
  </style>
</head>

<body>
  <header>
    <h1>INTRAEMPREENDORISMO: O JOGO</h1>
  </header>
  <main>
    <div>
        <img src="imgs/intro/logo.png" alt="Imagem Inicial" width="300px" height="300px">
    </div>
        <div class="buttons-row">
            <div class="button-container3">
                <button><a href="intro.html">INICIAR JORNADA</a></button>
            </div>
        </div>
  </main>
  <footer>
    <p>&copy;2025 Todos os direitos reservados. Desenvolvido pela turma 202400055.</p>
  </footer>
</body>

</html>
